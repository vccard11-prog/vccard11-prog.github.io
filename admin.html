<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تطبيق الإدارة | VC Admin</title>
<link rel="icon" type="image/jpeg" href="Gemini_Generated_Image_k8lwiwk8lwiwk8lw.jpeg">
<script src="https://jsdelivr.net"></script>
<style>
@import url('https://googleapis.com');
:root{--bg-dark:#07090e;--bg-card:#111623;--primary:#7c3aed;--secondary:#06b6d4;--gold:#fbbf24;--green:#10b981;--red:#ef4444;--border:rgba(255,255,255,0.08)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg-dark);color:#fff;padding-bottom:40px}
.lock-screen{position:fixed;inset:0;background:var(--bg-dark);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-box{background:var(--bg-card);border:1px solid var(--primary);border-radius:22px;padding:28px;width:100%;max-width:380px;text-align:center}
.lock-box h2{color:var(--gold);margin-bottom:8px}
.lock-box input{width:100%;padding:12px;background:#07090e;border:1px solid #2b344d;border-radius:12px;color:#fff;text-align:center;font-size:1rem;margin:14px 0}
.lock-box button{width:100%;padding:12px;background:var(--primary);border:none;border-radius:12px;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
header{background:var(--bg-card);padding:15px 5%;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.title{font-weight:900;font-size:1.15rem;color:var(--gold)}
.refresh-btn{background:rgba(6,182,212,0.15);color:var(--secondary);border:1px solid var(--secondary);padding:6px 12px;border-radius:10px;font-weight:700;font-size:0.8rem;cursor:pointer}
.container{max-width:750px;margin:20px auto;padding:0 15px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);padding:16px;border-radius:16px;text-align:center}
.stat-card span{font-size:0.8rem;color:#94a3b8}
.stat-card h3{font-size:1.5rem;font-weight:900;color:var(--secondary);margin-top:4px}
.search-bar{width:100%;padding:12px 15px;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;color:#fff;margin-bottom:16px;font-size:0.9rem}
.user-card{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:12px}
.user-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.user-info h4{font-size:1rem;font-weight:800}
.user-info p{font-size:0.78rem;color:#94a3b8}
.user-bal{background:rgba(16,185,129,0.15);color:var(--green);border:1px solid rgba(16,185,129,0.3);padding:6px 12px;border-radius:10px;font-weight:900;font-size:1.05rem}
.actions-row{display:flex;gap:8px}
.amt-input{flex:1;padding:10px;background:#07090e;border:1px solid #2b344d;border-radius:10px;color:#fff;font-weight:800;text-align:center}
.btn-add{background:var(--green);color:#000;border:none;padding:10px 14px;border-radius:10px;font-weight:900;cursor:pointer}
.btn-sub{background:var(--red);color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:900;cursor:pointer}
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
<div class="lock-box">
<h2>🔐 إدارة VC Store 1</h2>
<p style="font-size:0.82rem;color:#94a3b8">أدخل رمز الإدارة السري للدخول</p>
<input type="password" id="adminPassInput" placeholder="رمز المرور...">
<button onclick="unlockAdmin()">دخول لوحة الإدارة</button>
</div>
</div>

<header>
<div class="title">👑 إدارة المحافظ والعملاء</div>
<button class="refresh-btn" onclick="loadUsers()">🔄 تحديث القائمة</button>
</header>

<div class="container">
<div class="stats-grid">
<div class="stat-card"><span>إجمالي العملاء المسجلين</span><h3 id="totalUsers">0</h3></div>
<div class="stat-card"><span>إجمالي أرصدة المحافظ</span><h3 id="totalBalances">$0.00</h3></div>
</div>

<input type="text" id="searchUser" class="search-bar" placeholder="ابحث باسم العميل أو بريده الإلكتروني..." onkeyup="filterUsers()">
<div id="usersList"></div>
</div>

<script>
const ADMIN_PASS = "VC2026ADMIN";
const SUPABASE_URL = "https://qfumtnofsifygdxfxdyq.supabase.co";
const SUPABASE_KEY = "sb_publishable_J0SXeWud6RX2oNDrE_xSBw_fZ06jP1B";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allUsers = [];

function unlockAdmin() {
  const val = document.getElementById('adminPassInput').value.trim();
  if (val === ADMIN_PASS) {
    document.getElementById('lockScreen').style.display = 'none';
    sessionStorage.setItem('vc_admin_auth', '1');
    loadUsers();
  } else {
    alert("❌ رمز الإدارة غير صحيح!");
  }
}

if (sessionStorage.getItem('vc_admin_auth') === '1') {
  document.getElementById('lockScreen').style.display = 'none';
  loadUsers();
}

async function loadUsers() {
  const list = document.getElementById('usersList');
  list.innerHTML = '<p style="text-align:center;color:#94a3b8">⏳ جاري تحميل بيانات العملاء...</p>';
  
  const { data, error } = await sb.from('profiles').select('*').order('created_at', { ascending: false });
  if (error) {
    list.innerHTML = `<p style="color:#ef4444;text-align:center">خطأ في التحميل: ${error.message}</p>`;
    return;
  }

  allUsers = data || [];
  document.getElementById('totalUsers').innerText = allUsers.length;
  const sum = allUsers.reduce((acc, u) => acc + parseFloat(u.balance || 0), 0);
  document.getElementById('totalBalances').innerText = '$' + sum.toFixed(2);
  renderUsers(allUsers);
}

function renderUsers(users) {
  const list = document.getElementById('usersList');
  if (users.length === 0) {
    list.innerHTML = '<p style="text-align:center;color:#94a3b8">لا يوجد عملاء مسجلون بعد.</p>';
    return;
  }
  list.innerHTML = '';
  users.forEach(u => {
    const bal = parseFloat(u.balance || 0);
    list.innerHTML += `
      <div class="user-card">
        <div class="user-top">
          <div class="user-info">
            <h4>${u.full_name || 'عميل'}</h4>
            <p>${u.email}</p>
          </div>
          <div class="user-bal">$${bal.toFixed(2)}</div>
        </div>
        <div class="actions-row">
          <input type="number" step="0.1" id="amt_${u.id}" class="amt-input" placeholder="المبلغ ($)">
          <button class="btn-add" onclick="updateBalance('${u.id}', ${bal}, 1)">+ إضافة</button>
          <button class="btn-sub" onclick="updateBalance('${u.id}', ${bal}, -1)">- خصم</button>
        </div>
      </div>
    `;
  });
}

function filterUsers() {
  const q = document.getElementById('searchUser').value.toLowerCase();
  const filtered = allUsers.filter(u => (u.email || '').toLowerCase().includes(q) || (u.full_name || '').toLowerCase().includes(q));
  renderUsers(filtered);
}

async function updateBalance(userId, currentBal, sign) {
  const input = document.getElementById('amt_' + userId);
  const amount = parseFloat(input.value);
  if (!amount || amount <= 0) {
    alert("أدخل مبلغاً صحيحاً أولاً!");
    return;
  }
  const newBal = Math.max(0, currentBal + (amount * sign));
  const { error } = await sb.from('profiles').update({ balance: newBal }).eq('id', userId);
  if (error) {
    alert("حدث خطأ: " + error.message);
  } else {
    alert(`✅ تم تحديث الرصيد بنجاح! الرصيد الجديد: $${newBal.toFixed(2)}`);
    loadUsers();
  }
}
</script>
</body>
</html>
