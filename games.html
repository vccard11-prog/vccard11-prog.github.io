<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قسم الألعاب | VC Store 1</title>

<style>
@import url('https://googleapis.com');
:root{--bg-dark:#090b10;--bg-card:#121622;--primary:#7c3aed;--secondary:#06b6d4;--gold:#fbbf24;--border:rgba(255,255,255,0.08);--text-main:#f8fafc;--text-dim:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
body{background-color:var(--bg-dark);color:var(--text-main);padding-bottom:85px}
header{background:rgba(18,22,34,0.92);backdrop-filter:blur(12px);padding:14px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.brand{font-size:1.3rem;font-weight:900;color:#fff;text-decoration:none}
.brand span{color:var(--primary)}
.back-btn{background:var(--primary);color:#fff;text-decoration:none;padding:7px 14px;border-radius:10px;font-size:0.85rem;font-weight:700}
.container{max-width:800px;margin:20px auto;padding:0 15px}
.header-box{text-align:center;margin-bottom:22px}
.header-box h1{font-size:1.45rem;font-weight:900;color:var(--gold);margin-bottom:4px}
.header-box p{font-size:0.85rem;color:var(--text-dim)}
.games-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.game-card{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:14px;text-align:center;cursor:pointer;transition:0.25s;position:relative;overflow:hidden}
.game-card:hover{border-color:var(--secondary);transform:translateY(-4px);box-shadow:0 10px 25px rgba(6,182,212,0.2)}
.game-banner{height:95px;border-radius:12px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;position:relative}
.bg-pubg{background:linear-gradient(135deg,#b45309,#f59e0b)}
.bg-ff{background:linear-gradient(135deg,#991b1b,#ef4444)}
.bg-ml{background:linear-gradient(135deg,#1e3a8a,#3b82f6)}
.bg-rbx{background:linear-gradient(135deg,#374151,#6b7280)}
.bg-fc{background:linear-gradient(135deg,#065f46,#10b981)}
.bg-cod{background:linear-gradient(135deg,#4c1d95,#8b5cf6)}
.tag-fast{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.6);color:#10b981;font-size:0.7rem;font-weight:800;padding:2px 8px;border-radius:6px}
.game-card h3{font-size:1rem;font-weight:800;margin-bottom:4px}
.game-card span{font-size:0.78rem;color:var(--secondary);font-weight:700}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(6px);z-index:1000;display:none;align-items:center;justify-content:center;padding:15px}
.modal-overlay.show{display:flex}
.modal-box{background:#141926;border:1px solid rgba(124,58,237,0.5);border-radius:22px;width:100%;max-width:440px;padding:22px;position:relative;animation:popIn 0.25s ease}
@keyframes popIn{from{transform:scale(0.9);opacity:0}to{transform:scale(1);opacity:1}}
.close-modal{position:absolute;top:16px;left:16px;background:rgba(255,255,255,0.08);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.modal-title{font-size:1.15rem;font-weight:900;color:var(--gold);margin-bottom:4px;padding-left:35px}
.modal-sub{font-size:0.78rem;color:var(--text-dim);margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:0.82rem;color:var(--text-dim);margin-bottom:6px;font-weight:700}
.field select,.field input{width:100%;padding:12px 14px;background:#090b10;border:1px solid #283047;border-radius:12px;color:#fff;font-size:0.92rem;font-weight:600}
.field select:focus,.field input:focus{outline:none;border-color:var(--secondary)}
.modal-btns{display:grid;grid-template-columns:2fr 1fr;gap:10px;margin-top:20px}
.btn-exec{padding:13px;border:none;border-radius:12px;font-weight:800;font-size:0.92rem;cursor:pointer;color:#fff;transition:0.2s}
.btn-confirm{background:linear-gradient(90deg,#7c3aed,#06b6d4);box-shadow:0 4px 15px rgba(124,58,237,0.35)}
.btn-cancel{background:#23293d;color:var(--text-dim)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#121622;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:8px 0 10px;z-index:900}
.nav-tab{text-decoration:none;color:var(--text-dim);font-size:0.72rem;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.nav-tab.active{color:var(--secondary)}
</style>
</head>
