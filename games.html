<script>
const SERVER_URL = "https://onrender.com";

const gamesCatalog={
pubg:{title:"شحن شدات ببجي موبايل (PUBG UC)",label:"أدخل معرف اللاعب في ببجي (Player ID):",placeholder:"مثال: 5123456789",packages:[
{id:"78",name:"ببجي - 60 شدة روبوت",price:1.00},
{id:"95",name:"ببجي - 325 شدة روبوت",price:5.00},
{id:"115",name:"ببجي - 660 شدة روبوت",price:10.00},
{id:"132",name:"ببجي - 1800 شدة روبوت",price:25.00},
{id:"2363",name:"ببجي - 3850 شدة روبوت",price:50.00},
{id:"2366",name:"ببجي - 8100 شدة روبوت",price:100.00}
]},
ff:{title:"شحن جواهر فري فاير (Free Fire)",label:"أدخل معرف اللاعب في فري فاير (Player ID):",placeholder:"مثال: 198273645",packages:[
{id:"0",name:"فري فاير - 100 جوهرة + بونص",price:1.00},
{id:"0",name:"فري فاير - 310 جوهرة + بونص",price:3.00},
{id:"0",name:"فري فاير - 520 جوهرة + بونص",price:5.00},
{id:"0",name:"فري فاير - 1060 جوهرة + بونص",price:10.00}
]},
ml:{title:"شحن جواهر موبايل ليجند",label:"أدخل الـ User ID مع رقم السيرفر (Zone ID):",placeholder:"مثال: 12345678 (1234)",packages:[
{id:"0",name:"موبايل ليجند - 86 جوهرة",price:2.00},
{id:"0",name:"موبايل ليجند - 172 جوهرة",price:4.00}
]},
rbx:{title:"شحن روبلوكس (Roblox Robux)",label:"أدخل اسم المستخدم في روبلوكس:",placeholder:"اسم الحساب...",packages:[
{id:"0",name:"روبلوكس - 400 روبوكس",price:5.00},
{id:"0",name:"روبلوكس - 800 روبوكس",price:10.00}
]},
fc:{title:"شحن نقاط FC Mobile",label:"أدخل معرف الحساب (User ID):",placeholder:"اكتب رقم الـ ID هنا...",packages:[
{id:"0",name:"FC Mobile - 100 نقطة",price:1.00},
{id:"0",name:"FC Mobile - 520 نقطة",price:5.00}
]},
cod:{title:"شحن نقاط كول أوف ديوتي (COD CP)",label:"أدخل معرف اللاعب (Player ID):",placeholder:"اكتب رقم الـ ID هنا...",packages:[
{id:"0",name:"كول أوف ديوتي - 80 نقطة CP",price:1.00},
{id:"0",name:"كول أوف ديوتي - 420 نقطة CP",price:5.00}
]}
};

function openGameModal(key){
const g=gamesCatalog[key];
document.getElementById('mTitle').innerText=g.title;
document.getElementById('mIdLabel').innerText=g.label;
document.getElementById('mPlayerId').placeholder=g.placeholder;
document.getElementById('mPlayerId').value="";
const sel=document.getElementById('mPackages');
sel.innerHTML="";
g.packages.forEach(p=>{
const opt=document.createElement('option');
opt.value=p.name;
opt.setAttribute('data-id',p.id);
opt.setAttribute('data-price',p.price);
opt.textContent=`${p.name} - ($${p.price.toFixed(2)})`;
sel.appendChild(opt);
});
document.getElementById('gameModal').classList.add('show');
}

function closeModal(){document.getElementById('gameModal').classList.remove('show')}

async function submitDirectGameOrder(){
const sel=document.getElementById('mPackages');
const opt=sel.options[sel.selectedIndex];
const serviceId=opt.getAttribute('data-id');
const pkgName=sel.value;
const pkgPrice=parseFloat(opt.getAttribute('data-price'))||1.00;
const pid=document.getElementById('mPlayerId').value.trim();

if(!pid){
alert("يرجى إدخال معرف اللاعب (ID) أولاً!");
document.getElementById('mPlayerId').focus();
return;
}

const btn=document.querySelector('.btn-confirm');
btn.innerText="⏳ جاري التنفيذ الآلي...";
btn.disabled=true;

let orderStatus="wait";
let orderTime="قيد المعالجة";
let serverReply="";

if(serviceId && serviceId !== "0"){
try{
const res=await fetch(`${SERVER_URL}/api/create-order`,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({service_id:serviceId,target_id:pid,quantity:1})
});
const data=await res.json();
if(data.success){
orderStatus="done";
orderTime="فوري (API)";
} else {
serverReply = `\nتنبيه السيرفر: ${data.error || 'يرجى مراجعة صيغة التوثيق'}`;
}
}catch(e){
serverReply = "\nتعذر الاتصال بالسيرفر حالياً (قد يكون في وضع السكون لثوانٍ).";
}
}

const orderId="#"+Math.floor(10000+Math.random()*90000);
let orders=JSON.parse(localStorage.getItem('vc_orders')||'[]');
orders.unshift({
id:orderId,
service:pkgName,
target:pid,
date:new Date().toLocaleDateString('en-CA'),
price:pkgPrice,
status:orderStatus,
time:orderTime
});
localStorage.setItem('vc_orders',JSON.stringify(orders));

btn.innerText="🚀 تأكيد الشراء";
btn.disabled=false;
closeModal();
alert(`✅ تم تسجيل طلبك!\nرقم الطلب: ${orderId}\nالحالة: ${orderStatus==='done'?'مكتمل فوراً عبر API':'قيد المعالجة'}${serverReply}`);
window.location.href='orders.html';
}
</script>
</body>
</html>
