function loadCategory(key, element) {
const section = catalogData[key];
document.getElementById('selectedCategory').value = section.name;
document.getElementById('targetLabel').innerText = section.label;
document.getElementById('targetInput').placeholder = section.placeholder;
const dropdown = document.getElementById('packageList');
dropdown.innerHTML = "";
section.items.forEach(item => {
const option = document.createElement("option");
option.value = item;
option.textContent = item;
dropdown.appendChild(option);
});
document.querySelectorAll('.cat-item, .telecom-card').forEach(card => card.classList.remove('active'));
if (element) element.classList.add('active');
document.getElementById('orderPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
window.addEventListener('DOMContentLoaded', () => {
loadCategory('chat', document.querySelector('.cat-item.active'));
});
function submitOrder(platform) {

const selectedPkg = document.getElementById('packageList').value;
const targetId = document.getElementById('targetInput').value.trim();
if (!targetId) {
alert('يرجى إدخال البيانات المطلوبة (المعرف أو رقم الهاتف) لإتمام الطلب!');
document.getElementById('targetInput').focus();
return;
}
