<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VC Store 1 | متجر الخدمات الرقمية المتكامل</title>
    <style>
        @import url('https://googleapis.com');

        :root {
            --bg-main: #0b0d17;
            --bg-card: #151828;
            --purple-grad: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            --purple-accent: #7c4dff;
            --cyan-accent: #00e5ff;
            --text-white: #ffffff;
            --text-gray: #9ea7c0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            padding-bottom: 85px;
        }

        /* Header */
        header {
            background: #111424;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(124, 77, 255, 0.2);
        }

        .wallet-badge {
            background: #1c2036;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            border: 1px solid rgba(0, 229, 255, 0.3);
            cursor: pointer;
        }

        .wallet-plus {
            background: var(--cyan-accent);
            color: #000;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        .brand-title {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--text-white);
            letter-spacing: 0.5px;
        }

        .brand-title span {
            color: var(--cyan-accent);
        }

        .home-link {
            background: var(--purple-accent);
            color: #fff;
            padding: 6px 12px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* Top Pills */
        .pills-bar {
            display: flex;
            gap: 10px;
            padding: 12px 16px 4px;
            overflow-x: auto;
        }

        .pill {
            background: #161a2e;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-gray);
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .pill span {
            color: #00e676;
            margin-left: 5px;
        }

        /* Hero Banner */
        .banner-wrap {
            padding: 12px 16px;
        }

        .hero-banner {
            background: linear-gradient(135deg, #2b1055, #4a148c, #1a237e);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(124, 77, 255, 0.4);
            box-shadow: 0 8px 25px rgba(74, 20, 140, 0.3);
            position: relative;
            overflow: hidden;
        }

        .hero-banner h2 {
            font-size: 1.3rem;
            font-weight: 900;
            color: var(--cyan-accent);
            margin-bottom: 6px;
        }

        .hero-banner p {
            font-size: 0.9rem;
            color: #e0e0e0;
            margin-bottom: 10px;
        }

        .hero-tag {
            display: inline-block;
            background: rgba(0,0,0,0.4);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #ffd700;
            font-weight: 700;
        }

        /* Mobile Topup Bar */
        .topup-card {
            margin: 8px 16px 20px;
            background: var(--purple-grad);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 117, 252, 0.3);
        }

        .topup-info h3 {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .topup-info p {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .topup-icon {
            font-size: 1.8rem;
            background: rgba(255,255,255,0.15);
            padding: 10px;
            border-radius: 12px;
        }

        /* Categories Section */
        .sec-header {
            padding: 0 16px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sec-header h2 {
            font-size: 1.15rem;
            font-weight: 800;
        }

        .cat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 0 16px;
        }

        .cat-item {
            background: var(--bg-card);
            border-radius: 14px;
            padding: 14px 8px;
            text-align: center;
            border: 1px solid rgba(124, 77, 255, 0.18);
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .cat-item:active {
            transform: scale(0.96);
            border-color: var(--cyan-accent);
        }

        .cat-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(124, 77, 255, 0.25);
            color: #b388ff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 6px;
        }

        .cat-icon-box {
            width: 54px;
            height: 54px;
            margin: 6px auto 10px;
            background: linear-gradient(145deg, #1f243d, #131626);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.7rem;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .cat-item h4 {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-white);
            line-height: 1.3;
        }

        /* Order Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 999;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-box {
            background: #151828;
            width: 100%;
            max-width: 500px;
            border-radius: 22px 22px 0 0;
            padding: 24px 20px;
            border-top: 2px solid var(--purple-accent);
            animation: slideUp 0.25s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-head h3 {
            color: var(--cyan-accent);
            font-size: 1.2rem;
        }

        .close-btn {
            background: #252a44;
            color: #fff;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-gray);
            margin-bottom: 6px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            background: #0b0d17;
            border: 1px solid rgba(124, 77, 255, 0.3);
            color: #fff;
            font-size: 0.95rem;
        }

        .send-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 18px;
        }

        .btn-order {
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-wa { background: #25D366; color: #000; }
        .btn-tg { background: #0088cc; color: #fff; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #111424;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid rgba(255,255,255,0.06);
            z-index: 90;
        }

        .nav-item {
            text-align: center;
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--cyan-accent);
            font-weight: 700;
        }

        .nav-icon {
            font-size: 1.3rem;
            display: block;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <header>
        <div class="wallet-badge" onclick="openTopupWallet()">
            <span class="wallet-plus">+</span>
            <span>$0.00</span>
        </div>
        <div class="brand-title">VC Store <span>1</span></div>
        <a href="index.html" class="home-link">الرئيسية</a>
    </header>
