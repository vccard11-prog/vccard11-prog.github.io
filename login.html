<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | VC Store 1</title>
<link rel="icon" type="image/jpeg" href="Gemini_Generated_Image_k8lwiwk8lwiwk8lw.jpeg">
<script src="https://jsdelivr.net"></script>
<style>
@import url('https://googleapis.com');
:root{--bg-dark:#090b10;--bg-card:#121622;--primary:#7c3aed;--secondary:#06b6d4;--gold:#fbbf24;--border:rgba(255,255,255,0.08);--text-main:#f8fafc;--text-dim:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg-dark);color:var(--text-main);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{background:var(--bg-card);border:1px solid rgba(124,58,237,0.4);border-radius:24px;width:100%;max-width:420px;padding:28px 22px;box-shadow:0 15px 40px rgba(0,0,0,0.6)}
.logo-area{text-align:center;margin-bottom:20px}
.logo-area img{width:64px;height:64px;border-radius:16px;border:2px solid var(--primary);margin-bottom:10px}
.logo-area h1{font-size:1.4rem;font-weight:900}
.logo-area h1 span{color:var(--primary)}
.logo-area p{font-size:0.82rem;color:var(--text-dim);margin-top:4px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#090b10;padding:5px;border-radius:12px;margin-bottom:20px;border:1px solid var(--border)}
.tab-btn{padding:10px;border:none;background:none;color:var(--text-dim);font-weight:800;font-size:0.88rem;border-radius:9px;cursor:pointer;transition:0.2s}
.tab-btn.active{background:var(--primary);color:#fff}
.field{margin-bottom:15px}
.field label{display:block;font-size:0.82rem;color:var(--text-dim);margin-bottom:6px;font-weight:700}
.field input{width:100%;padding:12px 14px;background:#090b10;border:1px solid #283047;border-radius:12px;color:#fff;font-size:0.92rem;font-weight:600}
.field input:focus{outline:none;border-color:var(--secondary)}
.btn-submit{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#7c3aed,#06b6d4);color:#fff;font-weight:900;font-size:0.95rem;cursor:pointer;margin-top:6px}
.msg{margin-top:14px;padding:10px;border-radius:10px;font-size:0.82rem;font-weight:700;text-align:center;display:none}
.msg.err{background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid rgba(239,68,68,0.3);display:block}
.msg.ok{background:rgba(16,185,129,0.15);color:#10b981;border:1px solid rgba(16,185,129,0.3);display:block}
.back-home{display:block;text-align:center;margin-top:18px;color:var(--text-dim);text-decoration:none;font-size:0.82rem;font-weight:700}
</style>
</head>
<body>

<div class="auth-box">
<div class="logo-area">
<img src="Gemini_Generated_Image_k8lwiwk8lwiwk8lw.jpeg" alt="VC Store 1">
<h1>VC Store <span>1</span></h1>
<p>بوابة العملاء والمحفظة الإلكترونية</p>
</div>

<div class="tabs">
<button class="tab-btn active" id="tabLogin" onclick="switchMode('login')">تسجيل الدخول</button>
<button class="tab-btn" id="tabReg" onclick="switchMode('register')">إنشاء حساب جديد</button>
</div>

<div class="field" id="nameField" style="display:none">
<label>الاسم الكامل:</label>
<input type="text" id="fullName" placeholder="اكتب اسمك هنا...">
</div>

<div class="field">
<label>البريد الإلكتروني:</label>
<input type="email" id="email" placeholder="example@gmail.com">
</div>

<div class="field">
<label>كلمة المرور:</label>
<input type="password" id="password" placeholder="••••••••">
</div>

<button class="btn-submit" id="submitBtn" onclick="handleAuth()">🚀 دخول إلى حسابي</button>
<div class="msg" id="statusMsg"></div>
<a href="store.html" class="back-home">← العودة لتصفح المتجر</a>
</div>

<script>
const SUPABASE_URL = "https://qfumtnofsifygdxfxdyq.supabase.co";
const SUPABASE_KEY = "sb_publishable_J0SXeWud6RX2oNDrE_xSBw_fZ06jP1B";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let mode = 'login';

function switchMode(m) {
  mode = m;
  document.getElementById('tabLogin').classList.toggle('active', m === 'login');
  document.getElementById('tabReg').classList.toggle('active', m === 'register');
  document.getElementById('nameField').style.display = m === 'register' ? 'block' : 'none';
  document.getElementById('submitBtn').innerText = m === 'login' ? '🚀 دخول إلى حسابي' : '✨ إنشاء حساب ومحفظة جديدة';
  document.getElementById('statusMsg').style.display = 'none';
}

function showMsg(text, type) {
  const box = document.getElementById('statusMsg');
  box.innerText = text;
  box.className = 'msg ' + type;
}

async function handleAuth() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  const fullName = document.getElementById('fullName').value.trim() || email.split('@')[0];

  if (!email || !password) {
    showMsg("يرجى إدخال البريد الإلكتروني وكلمة المرور!", "err");
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerText = "⏳ جاري المعالجة...";

  if (mode === 'register') {
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) {
      showMsg("خطأ: " + error.message, "err");
    } else if (data.user) {
      await sb.from('profiles').insert([{
        id: data.user.id,
        email: email,
        full_name: fullName,
        balance: 0.00
      }]);
      showMsg("✅ تم إنشاء حسابك ومحفظتك بنجاح! جاري تحويلك للمتجر...", "ok");
      setTimeout(() => window.location.href = 'store.html', 1500);
    }
  } else {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      showMsg("❌ البريد الإلكتروني أو كلمة المرور غير صحيحة", "err");
    } else {
      showMsg("✅ تم تسجيل الدخول بنجاح! جاري الدخول للمتجر...", "ok");
      setTimeout(() => window.location.href = 'store.html', 1200);
    }
  }

  btn.disabled = false;
  btn.innerText = mode === 'login' ? '🚀 دخول إلى حسابي' : '✨ إنشاء حساب ومحفظة جديدة';
}
</script>
</body>
</html>
