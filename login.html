<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | VC Store 1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif}
body{background:#07090e;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.box{background:#111623;border:1px solid #7c3aed;border-radius:22px;width:100%;max-width:400px;padding:26px 20px;box-shadow:0 10px 35px rgba(124,58,237,0.3)}
.head{text-align:center;margin-bottom:18px}
.head img{width:64px;height:64px;border-radius:16px;border:2px solid #7c3aed;margin-bottom:8px}
.head h1{font-size:1.4rem;font-weight:900}
.head h1 span{color:#06b6d4}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#07090e;padding:4px;border-radius:12px;margin-bottom:18px}
.t-btn{padding:10px;border:none;background:none;color:#94a3b8;font-weight:800;border-radius:9px;cursor:pointer}
.t-btn.active{background:#7c3aed;color:#fff}
label{display:block;font-size:0.82rem;color:#94a3b8;margin-bottom:5px;font-weight:700}
input{width:100%;padding:12px;background:#07090e;border:1px solid #283047;border-radius:12px;color:#fff;margin-bottom:14px;font-size:0.95rem}
.btn{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(90deg,#7c3aed,#06b6d4);color:#fff;font-weight:900;font-size:0.95rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-spin{width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:sp 0.7s linear infinite;display:none}
@keyframes sp{to{transform:rotate(360deg)}}
.msg{margin-top:12px;padding:10px;border-radius:10px;font-size:0.82rem;text-align:center;display:none}
.err{background:rgba(239,68,68,0.2);color:#ef4444;display:block}
.ok{background:rgba(16,185,129,0.2);color:#10b981;display:block}
.back{display:block;text-align:center;margin-top:16px;color:#94a3b8;text-decoration:none;font-size:0.82rem}
</style>
</head>
<body>
<div class="box">
<div class="head">
<img src="Gemini_Generated_Image_k8lwiwk8lwiwk8lw.jpeg" alt="Logo">
<h1>VC Store <span>1</span></h1>
<p style="font-size:0.8rem;color:#94a3b8">بوابة العملاء والمحفظة الإلكترونية</p>
</div>
<div class="tabs">
<button type="button" class="t-btn active" id="b1" onclick="setM('login')">تسجيل الدخول</button>
<button type="button" class="t-btn" id="b2" onclick="setM('reg')">إنشاء حساب جديد</button>
</div>
<div id="nBox" style="display:none">
<label>الاسم الكامل:</label>
<input type="text" id="uName" placeholder="اكتب اسمك هنا...">
</div>
<label>البريد الإلكتروني:</label>
<input type="email" id="uEmail" placeholder="example@gmail.com">
<label>كلمة المرور:</label>
<input type="password" id="uPass" placeholder="••••••">
<button type="button" class="btn" id="goBtn" onclick="doAuth()">
  <span class="btn-spin" id="btnSpin"></span>
  <span id="btnTxt">🚀 دخول إلى حسابي</span>
</button>
<div class="msg" id="mBox"></div>
<a href="store.html" class="back">← العودة لتصفح المتجر</a>
</div>

<script src="https://jsdelivr.net" async></script>
<script>
const URL_SB = "https://supabase.co";
const KEY_SB = "sb_publishable_J0SXeWud6RX2oNDrE_xSBw_fZ06jP1B";
let mode = 'login';

function setM(m){
  mode = m;
  document.getElementById('b1').classList.toggle('active', m==='login');
  document.getElementById('b2').classList.toggle('active', m==='reg');
  document.getElementById('nBox').style.display = m==='reg' ? 'block' : 'none';
  document.getElementById('btnTxt').innerText = m==='login' ? '🚀 دخول إلى حسابي' : '✨ إنشاء حساب جديد';
  document.getElementById('mBox').style.display = 'none';
}

function showM(t, c){
  const el = document.getElementById('mBox');
  el.innerText = t; el.className = 'msg ' + c; el.style.display = 'block';
}

function setLoading(isLoad, text){
  document.getElementById('goBtn').disabled = isLoad;
  document.getElementById('btnSpin').style.display = isLoad ? 'inline-block' : 'none';
  document.getElementById('btnTxt').innerText = text;
}

async function doAuth(){
  const email = document.getElementById('uEmail').value.trim();
  const password = document.getElementById('uPass').value.trim();
  const nameInput = document.getElementById('uName').value.trim();
  const full_name = nameInput ? nameInput : email.split('@')[0];

  if(!email || password.length < 6){
    showM("⚠️ أدخل البريد الإلكتروني وكلمة مرور (6 خانات على الأقل)", "err");
    return;
  }

  setLoading(true, "جاري الاتصال بالخادم...");

  if(!window.supabase){
    await new Promise(r => setTimeout(r, 1500));
    if(!window.supabase){
      setLoading(false, mode==='login' ? '🚀 دخول إلى حسابي' : '✨ إنشاء حساب جديد');
      showM("⚠️ الشبكة بطيئة، يرجى الضغط على الزر مرة أخرى الآن.", "err");
      return;
    }
  }

  const sb = window.supabase.createClient(URL_SB, KEY_SB);

  try {
    if(mode === 'reg'){
      const { data, error } = await sb.auth.signUp({ email, password });
      if(error){
        showM("❌ " + error.message, "err");
      } else if(data && data.user){
        await sb.from('profiles').upsert([{ id: data.user.id, email: email, full_name: full_name, balance: 0 }]);
        showM("✅ تم إنشاء حسابك بنجاح! جاري التحويل...", "ok");
        setTimeout(()=> window.location.href = 'store.html', 900);
        return;
      }
    } else {
      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if(error){
        showM("❌ البريد أو كلمة المرور غير صحيحة", "err");
      } else {
        showM("✅ تم الدخول بنجاح! جاري التحويل...", "ok");
        setTimeout(()=> window.location.href = 'store.html', 800);
        return;
      }
    }
  } catch(e) {
    showM("⚠️ تعذر الاتصال بالشبكة: " + e.message, "err");
  }

  setLoading(false, mode==='login' ? '🚀 دخول إلى حسابي' : '✨ إنشاء حساب جديد');
}
</script>
</body>
</html>
