<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شحن المحفظة | VC Store 1</title>
<script src="https://jsdelivr.net"></script>
<style>
@import url('https://googleapis.com');
:root{--bg:#090b10;--card:#121622;--primary:#7c3aed;--sec:#06b6d4;--gold:#fbbf24;--border:rgba(255,255,255,0.08)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:#fff;padding-bottom:80px}
header{background:var(--card);padding:14px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border)}
.brand{font-weight:900;font-size:1.2rem;color:#fff;text-decoration:none}
.brand span{color:var(--primary)}
.back{background:var(--primary);color:#fff;padding:6px 12px;border-radius:10px;text-decoration:none;font-size:0.8rem;font-weight:700}
.container{max-width:500px;margin:20px auto;padding:0 15px}
.methods{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.m-btn{background:var(--card);border:1px solid var(--border);padding:12px 6px;border-radius:14px;text-align:center;cursor:pointer;font-weight:800;font-size:0.8rem;color:#94a3b8}
.m-btn.active{border-color:var(--sec);color:#fff;background:#171d2e}
.box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:15px}
.addr{background:#090b10;padding:12px;border-radius:10px;border:1px dashed var(--sec);text-align:center;font-weight:800;color:var(--gold);margin:10px 0;word-break:break-all;font-size:0.9rem}
.copy-btn{width:100%;padding:8px;background:rgba(6,182,212,0.15);color:var(--sec);border:1px solid var(--sec);border-radius:10px;font-weight:800;cursor:pointer;margin-bottom:14px}
label{display:block;font-size:0.82rem;color:#94a3b8;margin-bottom:6px;font-weight:700}
input{width:100%;padding:12px;background:#090b10;border:1px solid #283047;border-radius:12px;color:#fff;margin-bottom:14px;font-weight:700}
.submit{width:100%;padding:14px;background:linear-gradient(90deg,var(--primary),var(--sec));border:none;border-radius:12px;color:#fff;font-weight:900;font-size:0.95rem;cursor:pointer}
</style>
</head>
<body>
<header>
<a href="store.html" class="brand">VC Store <span>1</span></a>
<a href="store.html" class="back">العودة للمتجر</a>
</header>

<div class="container">
<h3 style="margin-bottom:12px;color:var(--gold);text-align:center">اختر وسيلة شحن المحفظة</h3>

<div class="methods">
<div class="m-btn active" id="btn_sham_usd" onclick="selectMethod('sham_usd')">💵 شام كاش ($)</div>
<div class="m-btn" id="btn_sham_syp" onclick="selectMethod('sham_syp')">🇸🇾 شام كاش (ل.س)</div>
<div class="m-btn" id="btn_usdt" onclick="selectMethod('usdt')">💲 USDT</div>
</div>

<div class="box">
<div id="methodTitle" style="font-weight:800;font-size:0.9rem;color:var(--sec)">كود محفظة شام كاش (دولار أمريكي $):</div>
<div class="addr" id="walletAddr">f73392cbc5a68ee4e84be15ace4729d4</div>
<button class="copy-btn" onclick="copyAddr()">📋 نسخ كود المحفظة</button>

<div id="sypCalcBox" style="display:none;background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.3);padding:10px;border-radius:10px;margin-bottom:14px;font-size:0.82rem;color:var(--gold)">
سعر الصرف المعتمد: <b>1$ = 12,000 ل.س</b><br>
المبلغ المطلوب تحويله بالليرة: <b id="sypTotal">0 ل.س</b>
</div>

<label>المبلغ المراد شحنه في محفظتك بالدولار ($):</label>
<input type="number" step="0.1" id="depAmount" placeholder="مثال: 5.00" onkeyup="calcSyp()">

<label>رقم العملية أو اسم المرسل للتأكيد:</label>
<input type="text" id="depTx" placeholder="اكتب رقم العملية أو اسمك الثلاثي...">

<button class="submit" id="sendBtn" onclick="sendDeposit()">🚀 إرسال إشعار الإيداع</button>
</div>
</div>
<script>
const SUPABASE_URL = "https://supabase.co";
const SUPABASE_KEY = "sb_publishable_J0SXeWud6RX2oNDrE_xSBw_fZ06jP1B";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const EXCHANGE_RATE = 12000;
const SHAM_CASH_CODE = "f73392cbc5a68ee4e84be15ace4729d4";

const paymentDetails = {
  sham_usd: { title: "كود محفظة شام كاش (دولار أمريكي $):", addr: SHAM_CASH_CODE, name: "شام كاش (دولار $)" },
  sham_syp: { title: "كود محفظة شام كاش (ليرة سورية SYP):", addr: SHAM_CASH_CODE, name: "شام كاش (ليرة سورية)" },
  usdt: { title: "عنوان محفظة USDT (شبكة TRC20):", addr: "TYourWalletAddressHere123456789", name: "USDT TRC20" }
};

let selectedKey = 'sham_usd';
let currentUser = null;

window.addEventListener('DOMContentLoaded', async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session && session.user) {
    currentUser = session.user;
  }
});

function selectMethod(key) {
  selectedKey = key;
  document.querySelectorAll('.m-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn_' + key).classList.add('active');
  document.getElementById('methodTitle').innerText = paymentDetails[key].title;
  document.getElementById('walletAddr').innerText = paymentDetails[key].addr;
  document.getElementById('sypCalcBox').style.display = key === 'sham_syp' ? 'block' : 'none';
  calcSyp();
}

function calcSyp() {
  const usd = parseFloat(document.getElementById('depAmount').value) || 0;
  const syp = Math.round(usd * EXCHANGE_RATE);
  document.getElementById('sypTotal').innerText = syp.toLocaleString('en-US') + ' ل.س';
}

function copyAddr() {
  const txt = document.getElementById('walletAddr').innerText;
  navigator.clipboard.writeText(txt);
  alert("✅ تم نسخ كود المحفظة بنجاح:\n" + txt);
}

async function sendDeposit() {
  if (!currentUser) {
    alert("🔐 يرجى تسجيل الدخول أولاً لتتمكن من إرسال إشعار الإيداع!");
    window.location.href = 'login.html';
    return;
  }
  const amt = parseFloat(document.getElementById('depAmount').value);
  const tx = document.getElementById('depTx').value.trim();

  if (!amt || amt <= 0 || !tx) {
    alert("⚠️ يرجى إدخال المبلغ بالدولار ورقم العملية أو اسم المرسل!");
    return;
  }

  let extraNote = tx;
  if (selectedKey === 'sham_syp') {
    const syp = Math.round(amt * EXCHANGE_RATE).toLocaleString('en-US');
    extraNote = `${tx} (المعادل: ${syp} ل.س)`;
  }

  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.innerText = "⏳ جاري الإرسال للإدارة...";

  const code = "#DEP-" + Math.floor(1000 + Math.random() * 9000);
  const { error } = await sb.from('orders_history').insert([{
    order_code: code,
    user_email: currentUser.email,
    order_type: 'deposit',
    service_name: 'إيداع ' + paymentDetails[selectedKey].name,
    target_info: extraNote,
    amount: amt,
    status: 'pending'
  }]);

  btn.disabled = false;
  btn.innerText = "🚀 إرسال إشعار الإيداع";

  if (error) {
    alert("❌ خطأ في الإرسال: " + error.message);
  } else {
    alert(`✅ تم إرسال إشعار الإيداع بنجاح!\nرقم المرجع: ${code}\nسيظهر الطلب الآن في لوحة الإدارة للموافقة وشحن رصيدك.`);
    window.location.href = 'store.html';
  }
}
</script>
</body>
</html>
