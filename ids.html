<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرقام باقات سوريا ماركت</title>
<style>
  body{background:#0b0e14;color:#fff;font-family:sans-serif;padding:15px}
  button{background:#06b6d4;color:#000;border:none;padding:11px 18px;border-radius:10px;font-weight:900;cursor:pointer}
  input{width:100%;padding:11px;margin:12px 0;border-radius:10px;border:1px solid #283047;background:#121622;color:#fff}
  .card{background:#121622;border:1px solid #232a3d;padding:12px;border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .id-num{color:#fbbf24;font-weight:900;font-size:1.05rem}
</style>
</head>
<body>
  <h3>📦 أرقام باقات سوريا ماركت (product_id)</h3>
  <button onclick="getProducts()">جلب الأرقام الآن ⚡</button>
  <input type="text" id="search" placeholder="ابحث عن: PUBG أو ببجي أو Free Fire..." onkeyup="filter()">
  <div id="box"></div>
    <script>
    const SB_URL = "https://supabase.co";
    const SB_KEY = "ضع_مفتاح_SB_KEY_هنا";
    let items = [];

    async function getProducts() {
      const box = document.getElementById("box");
      box.innerHTML = "جاري الاتصال بالسيرفر...";
      try {
        const res = await fetch(SB_URL + "/functions/v1/create-order", {
          method: "POST",
          headers: {
            "apikey": SB_KEY,
            "Authorization": "Bearer " + SB_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ action: "catalog" })
        });
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { box.innerHTML = "<pre>" + text + "</pre>"; return; }
        items = data.data || data.products || data || [];
        show(items);
      } catch (e) {
        box.innerHTML = "خطأ اتصال: " + e.message;
      }
    }

    function show(arr) {
      if (!Array.isArray(arr) || arr.length === 0) {
        document.getElementById("box").innerHTML = "<pre>" + JSON.stringify(arr, null, 2) + "</pre>";
        return;
      }
      document.getElementById("box").innerHTML = arr.map(p => `
        <div class="card">
          <div>
            <div style="font-weight:bold">${p.name || p.title || 'باقة'}</div>
            <div style="font-size:0.8rem;color:#94a3b8">السعر: $${p.price || 0}</div>
          </div>
          <div style="text-align:left">
            <div class="id-num">ID: ${p.id}</div>
            <button style="padding:5px 10px;font-size:0.75rem;margin-top:4px" onclick="navigator.clipboard.writeText('${p.id}');alert('تم نسخ: ${p.id}')">نسخ</button>
          </div>
        </div>
      `).join('');
    }

    function filter() {
      const q = document.getElementById("search").value.toLowerCase();
      show(items.filter(p => JSON.stringify(p).toLowerCase().includes(q)));
    }
  </script>
